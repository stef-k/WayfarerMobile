name: Build MAUI App

on:
  workflow_dispatch:  # Run only when Android-specific or release evidence is required.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.400'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-android:
    name: Build Android
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Java
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache NuGet packages
      uses: actions/cache@v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-maui-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-maui-
          ${{ runner.os }}-nuget-

    - name: Cache MAUI workload
      uses: actions/cache@v6.1.0
      id: cache-maui
      with:
        path: |
          C:\Program Files\dotnet\metadata
          C:\Program Files\dotnet\packs
          C:\Program Files\dotnet\library-packs
          C:\Program Files\dotnet\sdk-manifests
        key: ${{ runner.os }}-maui-workload-${{ env.DOTNET_VERSION }}

    - name: Install MAUI workload
      if: steps.cache-maui.outputs.cache-hit != 'true'
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore src/WayfarerMobile/WayfarerMobile.csproj

    - name: Build Android
      run: dotnet build src/WayfarerMobile/WayfarerMobile.csproj -f net10.0-android --configuration Release --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: android-build
        path: src/WayfarerMobile/bin/Release/net10.0-android/
        retention-days: 1
