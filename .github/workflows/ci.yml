name: CI - Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.400'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore tests/WayfarerMobile.Tests/WayfarerMobile.Tests.csproj

    - name: Build
      run: dotnet build tests/WayfarerMobile.Tests/WayfarerMobile.Tests.csproj --configuration Release --no-restore

    - name: Run tests with coverage
      run: |
        dotnet test tests/WayfarerMobile.Tests/WayfarerMobile.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./TestResults \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=cobertura \
          /p:CoverletOutput=./coverage/

    - name: Upload test results
      uses: actions/upload-artifact@v7.0.1
      if: always()
      continue-on-error: true
      with:
        name: test-results
        path: TestResults/
        retention-days: 1

    - name: Code Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: tests/WayfarerMobile.Tests/coverage/coverage.cobertura.xml
        badge: true
        format: markdown
        output: both
        thresholds: '50 75'

    - name: Add coverage PR comment
      uses: marocchino/sticky-pull-request-comment@v3.0.5
      if: github.event_name == 'pull_request'
      continue-on-error: true
      with:
        recreate: true
        path: code-coverage-results.md
